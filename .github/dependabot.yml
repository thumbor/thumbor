version: 2

updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # opencv-python-headless 5 has no cv2.CascadeClassifier, which the
      # cascade detectors and the redeye filter need. See thumbor/thumbor#1945.
      - dependency-name: opencv-python-headless

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: monthly
