---
name: release
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - "master"

permissions:
  contents: read
  packages: write

env:
  CIBW_PROJECT_REQUIRES_PYTHON: ">=3.10"
  RUST_TOOLCHAIN: "1.94.1"
  RUSTUP_VERSION: "1.29.0"
  python-version: "3.10"

jobs:
  # Heavily inspired on https://github.com/tornadoweb/tornado/blob/master/.github/workflows/build.yml
  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.19"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Build package
        run: >-
          uv run --locked --only-group release --only-group build
          python -m build --sdist --no-isolation

      - uses: actions/upload-artifact@v7
        with:
          name: artifact-sdist
          path: ./dist/thumbor-*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ env.python-version }}
          cache: "pip" # caching pip dependencies

      - name: Install Rust
        if: matrix.os == 'macos-latest'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          MACOSX_DEPLOYMENT_TARGET: 10.12
          CIBW_SKIP: "cp*-musllinux_i686"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_ENVIRONMENT_MACOS: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_ARCHS_MACOS: universal2
          CIBW_BEFORE_ALL_LINUX: |
            RUST_TOOLCHAIN="${{ env.RUST_TOOLCHAIN }}"
            RUSTUP_VERSION="${{ env.RUSTUP_VERSION }}"
            case "$(uname -m)" in
              x86_64)
                if ldd --version 2>&1 | grep -qi musl; then
                  rustup_triple="x86_64-unknown-linux-musl"
                  rustup_sha256="9cd3fda5fd293890e36ab271af6a786ee22084b5f6c2b83fd8323cec6f0992c1"
                else
                  rustup_triple="x86_64-unknown-linux-gnu"
                  rustup_sha256="4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10"
                fi
                ;;
              aarch64)
                if ldd --version 2>&1 | grep -qi musl; then
                  rustup_triple="aarch64-unknown-linux-musl"
                  rustup_sha256="88761caacddb92cd79b0b1f939f3990ba1997d701a38b3e8dd6746a562f2a759"
                else
                  rustup_triple="aarch64-unknown-linux-gnu"
                  rustup_sha256="9732d6c5e2a098d3521fca8145d826ae0aaa067ef2385ead08e6feac88fa5792"
                fi
                ;;
              *)
                echo "Unsupported Linux architecture: $(uname -m)" >&2
                exit 1
                ;;
            esac
            rustup_url="https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${rustup_triple}/rustup-init"
            curl --proto '=https' --tlsv1.2 -sSf -o /tmp/rustup-init "$rustup_url"
            echo "${rustup_sha256}  /tmp/rustup-init" | sha256sum -c -
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --no-modify-path --profile minimal --default-host "$rustup_triple" --default-toolchain "$RUST_TOOLCHAIN"
            rm /tmp/rustup-init
            . "$HOME/.cargo/env"
            actual_rustc="$(rustc --version)"
            case "$actual_rustc" in
              "rustc ${RUST_TOOLCHAIN} "*) ;;
              *)
                echo "Expected rustc ${RUST_TOOLCHAIN}, got ${actual_rustc}" >&2
                exit 1
                ;;
            esac
            actual_cargo="$(cargo --version)"
            case "$actual_cargo" in
              "cargo ${RUST_TOOLCHAIN} "*) ;;
              *)
                echo "Expected cargo ${RUST_TOOLCHAIN}, got ${actual_cargo}" >&2
                exit 1
                ;;
            esac
            rustc --version
            cargo --version
          CIBW_BEFORE_BUILD_MACOS: |
            actual_rustc="$(rustc --version)"
            case "$actual_rustc" in
              "rustc ${{ env.RUST_TOOLCHAIN }} "*) ;;
              *)
                echo "Expected rustc ${{ env.RUST_TOOLCHAIN }}, got ${actual_rustc}" >&2
                exit 1
                ;;
            esac
            actual_cargo="$(cargo --version)"
            case "$actual_cargo" in
              "cargo ${{ env.RUST_TOOLCHAIN }} "*) ;;
              *)
                echo "Expected cargo ${{ env.RUST_TOOLCHAIN }}, got ${actual_cargo}" >&2
                exit 1
                ;;
            esac
            rustc --version
            cargo --version

      - uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          overwrite: true

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: artifact-*
          path: dist
          merge-multiple: true

      - run: ls -lah dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: github.event_name != 'pull_request'
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  docker-build:
    needs: upload_pypi
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python_version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        platform:
          - runner: ubuntu-latest
            name: amd64
            os: linux/amd64
          - runner: ubuntu-24.04-arm
            name: arm64
            os: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"

      - uses: actions/download-artifact@v8
        with:
          pattern: artifact-*
          path: dist
          merge-multiple: true

      - name: Set output on new tags
        if: github.event_name != 'pull_request'
        run: echo "THUMBOR_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Set output on PR
        if: github.event_name == 'pull_request'
        run: echo "THUMBOR_VERSION=$(cat thumbor/__init__.py | grep "__version__" | cut -d'"' -f2)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          flavor: |
            suffix=-py-${{ matrix.python_version }}
          images: |
            ghcr.io/thumbor/thumbor
            quay.io/thumbor/thumbor
            thumbororg/thumbor
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: ${{ matrix.platform.os }}
          outputs: |
            type=image,name=ghcr.io/thumbor/thumbor,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
            type=image,name=quay.io/thumbor/thumbor,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
            type=image,name=docker.io/thumbororg/thumbor,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=registry,ref=ghcr.io/thumbor/thumbor:buildcache-${{ matrix.python_version }}-${{ matrix.platform.name }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/thumbor/thumbor:buildcache-{0}-{1},mode=max', matrix.python_version, matrix.platform.name) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            THUMBOR_VERSION=${{ env.THUMBOR_VERSION }}
            PYTHON_VERSION=${{ matrix.python_version }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          platform_digest=""

          for image in \
            "ghcr.io/thumbor/thumbor" \
            "quay.io/thumbor/thumbor" \
            "thumbororg/thumbor"
          do
            manifest="$(
              docker buildx imagetools inspect --raw "${image}@${digest}" \
                2>/dev/null || true
            )"

            if [ -z "$manifest" ]; then
              continue
            fi

            platform_digest="$(
              printf '%s' "$manifest" \
                | jq -r --arg arch "${{ matrix.platform.name }}" '
                  if .manifests then
                    [
                      .manifests[]
                      | select(
                          .platform.os == "linux"
                          and .platform.architecture == $arch
                        )
                      | .digest
                    ][0] // empty
                  else
                    empty
                  end
                '
            )"

            if [ -z "$platform_digest" ]; then
              platform_digest="$digest"
            fi

            break
          done

          if [ -z "$platform_digest" ]; then
            echo "Unable to resolve platform digest from ${digest}" >&2
            exit 1
          fi

          touch "/tmp/digests/${platform_digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.python_version }}-${{ matrix.platform.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    needs: docker-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.python_version }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          flavor: |
            suffix=-py-${{ matrix.python_version }}
          images: |
            ghcr.io/thumbor/thumbor
            quay.io/thumbor/thumbor
            thumbororg/thumbor
          tags: |
            type=schedule
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Create and push GHCR manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("ghcr.io/thumbor/thumbor:")) | "-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/thumbor/thumbor@sha256:%s ' *)

      - name: Create and push Quay.io manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("quay.io/thumbor/thumbor:")) | "-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'quay.io/thumbor/thumbor@sha256:%s ' *)

      - name: Create and push Docker Hub manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("thumbororg/thumbor:")) | "-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'thumbororg/thumbor@sha256:%s ' *)
